# /etc/nginx/sites-available/aragon. Replace SERVER_NAME; certbot adds the TLS server block.
upstream aragon_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name SERVER_NAME;

    # The API only receives small JSON bodies; files go straight to S3.
    client_max_body_size 64k;

    location / {
        proxy_pass http://aragon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/v1/images/events {
        proxy_pass http://aragon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
